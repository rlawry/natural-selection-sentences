<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Selection Sentences</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one fixed screen. Bar on top, graph fills the top half, the question panel fills the bottom half and swipes left when done. Light only, square corners. */
:root {
  --bg: #E9EEEA; --surface: #FFFFFF; --ink: #18211D; --muted: #56625B; --line: #B4C0B7; --grid: #DDE4DE;
  --accent: #1E5A86; --accent-ink: #FFFFFF; --accent-soft: #D7E5F0;
  --good: #2A7448; --good-soft: #D8ECDF; --bad: #AF2B1F; --bad-soft: #F6DBD7;
  --hot: #C8501A; --s1: #1E5A86; --s2: #C8501A;
  --font: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.35 var(--font); overflow: hidden; overscroll-behavior: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; border-radius: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
#app { height: 100%; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.08fr); gap: 6px; }

#bar { display: flex; align-items: center; gap: 10px; min-height: 34px; }
#bar h1 { margin: 0; font-size: clamp(16px, 4.4vw, 20px); white-space: nowrap; }
.prog { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pbar { flex: 1; height: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 30px; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.count { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14px; }
.btn { border: 2px solid var(--line); background: var(--surface); padding: 6px 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.fox { background: var(--hot); border-color: var(--hot); color: #fff; padding: 4px 10px; }
.btn:disabled { opacity: .45; cursor: default; }
@media (max-width: 520px) { .pbar { display: none; } .prog { justify-content: flex-end; } #score .lbl { display: none; } #score::before { content: "\2713  "; color: var(--good); } #foxBtn .long { display: none; } }

/* graph */
#graph { background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; transition: opacity .3s; }
#graph.fade { opacity: 0; }
.ghead { padding: 6px 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ghead h2 { margin: 0; font-size: clamp(15px, 4vw, 18px); }
.ghead p { margin: 0; font-size: clamp(13px, 3.6vw, 15px); color: var(--ink); }
.ghead p b { color: var(--hot); }
#plot { min-height: 0; min-width: 0; }
#plot svg { display: block; }
#plot text { font-family: var(--font); }

/* question deck */
#deck { position: relative; overflow: hidden; min-height: 0; }
.panel { position: absolute; inset: 0; background: var(--surface); border: 2px solid var(--ink); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; padding: 8px 12px 10px;
  transition: transform .45s cubic-bezier(.6, 0, .4, 1), opacity .45s; }
.panel.out { transform: translateX(-115%); opacity: .3; }
.panel.in { transform: translateX(115%); transition: none; }
.qhead { display: grid; gap: 2px; }
.qtag { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.qp { margin: 0; font-size: clamp(15px, 4.2vw, 18px); font-weight: 700; text-wrap: balance; }
.body { min-height: 0; display: grid; align-content: safe center; gap: 8px; }
@media (max-width: 700px) {
  #app.tall { grid-template-rows: auto minmax(0, .44fr) minmax(0, 1.56fr); }
  #app.tall .ghead { padding-top: 3px; }
  #app.tall .ghead p { display: none; }
  .lines .sent { font-size: 14px; line-height: 1.55; margin-bottom: 3px; }
  .lines .slot { line-height: 1.3; }
  .opts.idea { gap: 6px; }
  .opts.idea .opt { padding: 5px 8px; font-size: 13.5px; line-height: 1.25; }
  .qp { font-size: 15px; }
  .lines .sent .n { width: 1.1em; }
  .slot { min-width: 4.8em; }
  .bank { gap: 6px; }
  .bank .chip { padding: 4px 11px; }
}
.foot { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.fb { flex: 1; margin: 0; font-size: clamp(13px, 3.6vw, 15px); min-width: 0; }
.fb.good b:first-child { color: var(--good); } .fb.bad b:first-child { color: var(--bad); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.2s ease-in-out infinite; } }

/* pick lists */
.opts { display: grid; gap: 8px; }
.opts.pct { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { border: 2px solid var(--line); background: var(--surface); padding: 10px 8px; cursor: pointer; font-weight: 700; text-align: left; }
.opts.pct .opt { text-align: center; font-size: clamp(17px, 5vw, 22px); padding: 12px 4px; }
.opts.idea .opt { font-weight: 400; font-size: clamp(13.5px, 3.7vw, 15px); padding: 7px 10px; }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; cursor: default; }
.opt.good { background: var(--good-soft); border-color: var(--good); }
.opt:not(:disabled):hover { border-color: var(--accent); }

/* sentences with slots */
.sent { margin: 0; font-size: clamp(14.5px, 4vw, 17px); line-height: 2.05; }
.lines { display: grid; gap: 0; }
.lines .sent { line-height: 1.9; }
.lines .sent .n { display: inline-block; width: 1.4em; font-weight: 700; color: var(--muted); }
.slot { display: inline-block; min-width: 5.6em; padding: 0 6px; line-height: 1.5; text-align: center; border: 2px dashed var(--accent); background: var(--accent-soft); cursor: pointer; font-weight: 700; vertical-align: baseline; }
.slot.act { border-style: solid; outline: 3px solid var(--hot); outline-offset: 1px; }
.slot.full { border-style: solid; background: var(--surface); }
.slot.ok { border: 2px solid var(--good); background: var(--good-soft); cursor: default; }
.slot.over { background: var(--hot); color: #fff; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.shake { animation: shake .4s; border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.choices, .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 2px solid var(--ink); background: var(--surface); padding: 6px 14px; font-weight: 700; cursor: grab; touch-action: none; user-select: none; }
.chip.sel { background: var(--hot); border-color: var(--hot); color: #fff; }
.choices .chip { cursor: pointer; touch-action: manipulation; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }

/* shooting range */
.range { position: relative; height: 100%; min-height: 120px; overflow: hidden; background: repeating-linear-gradient(0deg, var(--surface) 0 38px, var(--grid) 38px 39px); border: 1px solid var(--line); cursor: crosshair; }
.tgt { position: absolute; left: 0; top: 0; border: 2px solid var(--ink); background: #FFF6D8; padding: 5px 12px; font-weight: 700; font-size: clamp(14px, 4vw, 17px); cursor: crosshair; white-space: nowrap; will-change: transform; }
.tgt.miss { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; opacity: .55; pointer-events: none; }
.tgt.hit { background: var(--good); border-color: var(--good); color: #fff; }
.boom { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 3px solid var(--hot); border-radius: 50%; pointer-events: none; animation: boom .45s ease-out forwards; }
@keyframes boom { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

/* end card */
.endc { display: grid; gap: 10px; justify-items: center; text-align: center; align-content: center; }
.endc h2 { margin: 0; font-size: clamp(20px, 6vw, 28px); }
.endc p { margin: 0; }
.endc .big { font-size: clamp(16px, 5vw, 22px); }

/* fox game */
#fox { position: fixed; inset: 0; z-index: 30; background: #10180F; }
#fc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.fhud { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.fhud > * { pointer-events: auto; }
#eaten { background: rgba(255, 255, 255, .88); border: 2px solid var(--ink); padding: 4px 12px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
#eatw { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); display: grid; gap: 6px; justify-items: center; }
#eat { font: 700 clamp(30px, 9vw, 54px)/1 var(--font); padding: 14px 34px; background: var(--hot); color: #fff; border: 4px solid #fff; cursor: pointer; letter-spacing: .04em; }
@keyframes eatp { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
#eat { animation: eatp .35s ease-in-out infinite; }
#eatbar { width: 180px; height: 10px; background: rgba(255, 255, 255, .5); border: 2px solid #fff; }
#eatbar i { display: block; height: 100%; background: #fff; }
.dirs { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; pointer-events: none; }
.dir { pointer-events: auto; width: 74px; height: 64px; font-size: 30px; background: rgba(255, 255, 255, .82); border: 3px solid var(--ink); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.dir.on { background: var(--hot); color: #fff; }
.fhelp { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; color: #fff; font-weight: 700; text-shadow: 0 1px 3px #000; text-align: center; font-size: 14px; width: min(60%, 420px); pointer-events: none; }
#gj { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 28px; }
#gj p { margin: 0; font: 700 clamp(56px, 16vw, 150px)/1 var(--font); color: #F4F1E6; }
@keyframes wig { 0% { transform: rotate(-5deg) scale(1); } 25% { transform: rotate(5deg) scale(1.06); } 50% { transform: rotate(-3deg) scale(.97); } 75% { transform: rotate(4deg) scale(1.04); } 100% { transform: rotate(-5deg) scale(1); } }
#gj p { animation: wig .9s ease-in-out infinite; }
#gj div { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
@media (prefers-reduced-motion: reduce) { #eat, #gj p { animation-duration: 3s; } }
</style>

<div id="app">
  <header id="bar">
    <h1>Selection Sentences</h1>
    <div class="prog"><div class="pbar" aria-hidden="true"><i id="pfill"></i></div><span class="count" id="pcount"></span></div>
    <span class="count" id="score"></span>
    <button type="button" class="btn fox" id="foxBtn" hidden>Fox<span class="long"> Run</span></button>
  </header>
  <section id="graph" aria-label="Population graph"><div class="ghead" id="ghead"></div><div id="plot"></div></section>
  <section id="deck"><div class="panel" id="panel" aria-live="polite"></div></section>
</div>

<div id="fox" hidden>
  <canvas id="fc" aria-label="Fox Run: a fox chasing rabbits, mice and squirrels through a forest"></canvas>
  <div class="fhud"><span id="eaten">Eaten 0 / 20</span><button type="button" class="btn" id="fxBack">Back to review</button></div>
  <div id="eatw" hidden><button type="button" id="eat">EAT!</button><div id="eatbar"><i></i></div></div>
  <div class="dirs"><button type="button" class="dir" id="dl" aria-label="Run left">◀</button><button type="button" class="dir" id="dr" aria-label="Run right">▶</button></div>
  <p class="fhelp" id="fhelp">Run with ◀ ▶ or the arrow keys. Catch an animal, then hit EAT fast (or press Space).</p>
  <div id="gj" hidden><p>good job.</p><div><button type="button" class="btn pri" id="gjAgain">Play again</button><button type="button" class="btn" id="gjBack">Back to review</button></div></div>
</div>

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
function inv(a) { return a.map(function (v) { return 100 - v; }); }
var S1 = 'var(--s1)', S2 = 'var(--s2)';

/* ---------- scenarios: graph + four questions each ---------- */
var SC = [
  { title: 'Snowshoe hares', what: 'Snow came a month early. Owls hunt the hares across the white snow.',
    series: [{ n: 'White fur', c: S1, d: [20, 24, 30, 38, 47, 56, 64, 71, 77, 82, 85] }, { n: 'Brown fur', c: S2 }],
    qs: [
      { t: 'shoot', tag: 'Shoot the word', p: 'Shoot the selection pressure.', targets: ['Owls on snow', 'White fur', 'Brown fur', 'Generations'], a: 'Owls on snow',
        why: 'A selection pressure is something in the environment that makes some variants more likely to survive. Here it is owls hunting on white snow.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'What percent of the hares had white fur in generation 0?', o: ['10%', '20%', '50%', '80%'], a: '20%',
        why: 'Find generation 0 on the white fur line. It starts at 20%.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'What percent of the hares had white fur in generation 10?', o: ['20%', '55%', '85%', '100%'], a: '85%',
        why: 'The white fur line ends at 85% in generation 10. It went up from 20%.' },
      { t: 'drag', tag: 'Drag the words', p: 'Build the four-step explanation for white fur.',
        lines: [['Owls hunting on snow make white fur ', { a: 'helpful' }, '.'], ['So white fur ', { a: 'increases' }, ' survival.'], ['Survivors pass white fur to their ', { a: 'offspring' }, '.'], ['So the percentage of white fur in the population goes ', { a: 'up' }, '.']],
        bank: ['helpful', 'harmful', 'increases', 'decreases', 'offspring', 'owls', 'up', 'down'],
        why: 'Pressure makes the trait helpful, so survival increases, survivors pass it to offspring, and the percentage goes up.' }] },
  { title: 'Island finches', what: 'A drought killed the plants with small, soft seeds. Only large, hard seeds are left.',
    series: [{ n: 'Deep beak', c: S1, d: [35, 38, 44, 51, 58, 64, 69, 73, 76, 78, 80] }, { n: 'Shallow beak', c: S2 }],
    qs: [
      { t: 'fill', tag: 'Fill in the blank', p: 'Choose the word for the blank.', parts: ['The drought makes deep beaks ', { o: ['helpful', 'harmful'], a: 'helpful' }, '.'],
        why: 'Deep beaks can crack the large, hard seeds that are left, so deep beaks are helpful.' },
      { t: 'fill', tag: 'Fill in the blank', p: 'Choose the word for the blank.', parts: ['So shallow beaks ', { o: ['increase', 'decrease'], a: 'decrease' }, ' survival.'],
        why: 'Shallow beaks cannot crack the hard seeds, so finches with shallow beaks are less likely to survive.' },
      { t: 'pick', kind: 'idea', tag: 'The right idea', p: 'Which sentence explains why deep beaks went up?',
        o: ['Finches grew deeper beaks because they needed to crack hard seeds.', 'Finches with deep beaks survived more and passed deep beaks to their offspring.', 'Each finch\'s beak got stronger from cracking seeds.', 'The drought made new deep-beaked finches appear.'],
        a: 'Finches with deep beaks survived more and passed deep beaks to their offspring.',
        why: 'No finch changed its own beak. Deep-beaked finches were already there; more of them survived and passed deep beaks on.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'How many percentage points did deep beaks go up from generation 0 to generation 10?', o: ['35', '45', '80', '115'], a: '45',
        why: 'Deep beaks went from 35% to 80%. 80 − 35 = 45 percentage points.' }] },
  { title: 'Red-finned minnows', what: 'Herons moved to the lake. Bright red fins are easy to spot from above.',
    series: [{ n: 'Red fins', c: S2, d: [60, 56, 51, 46, 40, 34, 29, 24, 20, 17, 15] }, { n: 'Silver fins', c: S1 }],
    qs: [
      { t: 'shoot', tag: 'Shoot the word', p: 'Herons make bright red fins ____. Shoot the missing word.', targets: ['helpful', 'harmful', 'stronger', 'faster'], a: 'harmful',
        why: 'Herons can see red fins easily, so red fins are harmful.' },
      { t: 'drag', tag: 'Drag the words', p: 'Build the four-step explanation for red fins.',
        lines: [['Herons make red fins ', { a: 'harmful' }, '.'], ['So red fins ', { a: 'decrease' }, ' survival.'], ['Fewer red-finned fish survive to pass red fins to their ', { a: 'offspring' }, '.'], ['So the percentage of red fins in the population goes ', { a: 'down' }, '.']],
        bank: ['helpful', 'harmful', 'increase', 'decrease', 'offspring', 'herons', 'up', 'down'],
        why: 'A harmful trait decreases survival, fewer fish pass it to offspring, and its percentage goes down.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'In which generation did red fins first drop below 50%?', o: ['Generation 1', 'Generation 3', 'Generation 6', 'Generation 10'], a: 'Generation 3',
        why: 'Red fins were 51% in generation 2 and 46% in generation 3.' },
      { t: 'fill', tag: 'Fill in the blank', p: 'Choose the word for the blank.', parts: ['So the percentage of silver fins in the population goes ', { o: ['up', 'down'], a: 'up' }, '.'],
        why: 'Silver fins are harder for herons to see, so they are helpful and their percentage goes up, from 40% to 85%.' }] },
  { title: 'Bacteria in a patient', what: 'A patient takes an antibiotic. It kills bacteria that cannot resist it.',
    series: [{ n: 'Resistant', c: S2, d: [5, 15, 32, 52, 68, 80, 88, 92, 95, 97, 98] }, { n: 'Not resistant', c: S1 }],
    qs: [
      { t: 'shoot', tag: 'Shoot the word', p: 'Shoot the selection pressure.', targets: ['Antibiotic', 'Resistance', 'Bacteria', 'Offspring'], a: 'Antibiotic',
        why: 'The antibiotic is the thing in the environment that decides which bacteria survive.' },
      { t: 'pick', kind: 'idea', tag: 'The right idea', p: 'Which sentence explains why resistant bacteria went up?',
        o: ['The antibiotic turned the bacteria into resistant bacteria.', 'Bacteria that were already resistant survived and passed resistance to their offspring.', 'The bacteria learned how to resist the antibiotic.', 'Resistant bacteria tried harder to survive.'],
        a: 'Bacteria that were already resistant survived and passed resistance to their offspring.',
        why: 'The antibiotic did not create resistance. A few bacteria already had it; they survived and passed it on.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'What percent of the bacteria were resistant in generation 0?', o: ['5%', '15%', '50%', '98%'], a: '5%',
        why: 'Resistant bacteria were rare at first, only 5%. They were already in the population before the antibiotic.' },
      { t: 'shoot', tag: 'Shoot the word', p: 'Survivors pass resistance to their ____. Shoot the missing word.', targets: ['offspring', 'predators', 'antibiotic', 'environment'], a: 'offspring',
        why: 'Traits are inherited: surviving bacteria pass resistance to their offspring.' }] },
  { title: 'Periwinkle snails', what: 'Shore crabs arrived on the beach. Crabs crush thin shells easily.',
    series: [{ n: 'Thick shell', c: S1, d: [30, 33, 38, 45, 52, 59, 65, 70, 74, 76, 78] }, { n: 'Thin shell', c: S2 }],
    qs: [
      { t: 'drag', tag: 'Drag the words', p: 'Build the four-step explanation for thick shells.',
        lines: [['Shore crabs make thick shells ', { a: 'helpful' }, '.'], ['So thick shells ', { a: 'increase' }, ' survival.'], ['Survivors pass thick shells to their ', { a: 'offspring' }, '.'], ['So the percentage of thick shells in the population goes ', { a: 'up' }, '.']],
        bank: ['helpful', 'harmful', 'increase', 'decrease', 'offspring', 'crabs', 'up', 'down'],
        why: 'Crabs make thick shells helpful, so survival increases, survivors pass thick shells on, and the percentage goes up.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'What percent of the snails had THIN shells in generation 10?', o: ['22%', '30%', '70%', '78%'], a: '22%',
        why: 'Read the thin shell line, not the thick one. It ends at 22%.' },
      { t: 'fill', tag: 'Fill in the blanks', p: 'Choose the word for each blank.', parts: ['Shore crabs make thin shells ', { o: ['helpful', 'harmful'], a: 'harmful' }, ', so thin shells ', { o: ['increase', 'decrease'], a: 'decrease' }, ' survival.'],
        why: 'Crabs crush thin shells, so thin shells are harmful and decrease survival.' },
      { t: 'shoot', tag: 'Shoot the word', p: 'Shoot the trait that is helpful.', targets: ['Thick shell', 'Thin shell', 'Shore crabs', 'Seaweed'], a: 'Thick shell',
        why: 'Thick shells resist the crabs. Shore crabs are the selection pressure, not a trait.' }] },
  { title: 'Greenhouse ladybugs', what: 'Ladybugs live in a greenhouse with no birds or other predators and plenty of food.',
    series: [{ n: '7 spots', c: S1, d: [48, 52, 47, 50, 55, 51, 46, 49, 53, 50, 48] }, { n: '2 spots', c: S2 }],
    qs: [
      { t: 'shoot', tag: 'Shoot the word', p: 'Shoot the selection pressure on spot pattern.', targets: ['No selection pressure', 'Birds', 'Spots', 'Food'], a: 'No selection pressure',
        why: 'There are no predators and food is plentiful, so nothing makes one spot pattern helpful or harmful.' },
      { t: 'pick', kind: 'idea', tag: 'The right idea', p: 'Why did the percentages wiggle but neither pattern take over?',
        o: ['Nothing makes one pattern helpful or harmful, so both survive and reproduce about equally.', 'Both spot patterns are harmful.', 'The ladybugs chose which spots to have.', '7-spot ladybugs are getting ready to take over.'],
        a: 'Nothing makes one pattern helpful or harmful, so both survive and reproduce about equally.',
        why: 'With no selection pressure, the percentages only drift up and down by chance.' },
      { t: 'pick', kind: 'pct', tag: 'Read the graph', p: 'About what percent of the ladybugs had 2 spots in generation 10?', o: ['10%', '52%', '90%', '100%'], a: '52%',
